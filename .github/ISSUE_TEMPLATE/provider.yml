name: Provider endpoint
description: Add or correct a provider endpoint
labels: [provider]
body:
  - type: input
    id: provider
    attributes:
      label: Provider id
      description: As shown by `anyagent providers <search>`, if it is already listed.
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Which endpoint?
      options:
        - Anthropic Messages (needed for Claude Code)
        - OpenAI Responses (needed for Codex and Copilot CLI)
        - OpenAI Chat Completions
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Base URL
      placeholder: https://api.example.com/anthropic
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: |
        Either vendor documentation, or a probe showing the route exists while a
        bogus sibling route on the same host returns 404. See CONTRIBUTING.md.
      render: shell
    validations:
      required: true
